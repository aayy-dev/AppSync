name: Build

# Build the rootless dev.aayy.appsyncunified and dev.aayy.appinst debs. On a v*
# tag: release both and tell the APT repo to publish them. appinst links the
# vendored libzip.a (appinst/libzip.a).
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  THEOS_COMMIT: 67db2ab8d950910161730de77c322658ea3e6b44
  SDK_ZIP: https://github.com/xybp888/iOS-SDKs/releases/download/iOS17.3.1-SDKs/iPhoneOS17.3.1.sdk.zip
  SDK_SHA256: 5db95a1a0492a6436d2cd40a0f66cf63f06b6d0a70c9a617ace25feb0dce222d

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install ldid dpkg make

      - name: Install Theos
        run: |
          THEOS="$RUNNER_TEMP/theos"
          git clone --quiet https://github.com/theos/theos.git "$THEOS"
          git -C "$THEOS" checkout --quiet "$THEOS_COMMIT"
          git -C "$THEOS" submodule update --init --recursive --quiet
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Install iOS SDK
        run: |
          curl -fsSL -o "$RUNNER_TEMP/sdk.zip" "$SDK_ZIP"
          echo "$SDK_SHA256  $RUNNER_TEMP/sdk.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/sdk.zip" -d "$RUNNER_TEMP/sdk"
          mkdir -p "$THEOS/sdks"
          mv "$RUNNER_TEMP/sdk/iPhoneOS17.3.1.sdk" "$THEOS/sdks/"

      - name: Build appsyncunified
        run: gmake package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1

      - name: Build appinst
        working-directory: appinst
        run: gmake package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1

      - name: Collect debs
        id: debs
        run: |
          mkdir -p out
          cp debs/dev.aayy.appsyncunified_*.deb out/
          cp appinst/debs/dev.aayy.appinst_*.deb out/
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: appsync-debs
          path: out/*.deb
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/*.deb \
            --title "$GITHUB_REF_NAME" --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" out/*.deb --clobber

      - name: Publish to APT repo
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.IOS_REPO_TOKEN }}
        run: |
          gh api repos/aayy-dev/aayy-dev.github.io/dispatches \
            -f event_type=publish-deb \
            -F "client_payload[repo]=${GITHUB_REPOSITORY}" \
            -F "client_payload[tag]=${GITHUB_REF_NAME}"
